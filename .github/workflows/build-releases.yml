name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*.*.*'  # 只在推送版本标签时触发构建
  workflow_dispatch:  # 允许手动触发
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.5)'
        required: true
        default: '1.0.5'

# 添加权限设置
permissions:
  contents: write  # 允许创建Release和上传文件
  actions: read    # 允许读取Actions状态

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Remove unnecessary large packages
      run: |
        # 明确卸载不需要的大型库，避免被PyInstaller打包
        pip uninstall -y torch torchvision torchaudio pyarrow || true
        echo "Removed large packages that are not needed"

    - name: Prepare database file
      run: |
        python scripts/prepare_database.py

    - name: Generate changelog
      run: |
        python auto_generate_changelog.py
        echo "Generated changelog file:"
        if (Test-Path "CHANGELOG_v*") { 
          Get-Item "CHANGELOG_v*" | ForEach { Write-Host $_.Name }
        }
    
    - name: Build Windows executable (OneDir)
      run: |
        python -m PyInstaller GeneticImprove_win.spec --clean --noconfirm
    
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
    
    - name: Create Inno Setup script
      run: |
        # 获取版本号
        $VERSION = python -c "from version import get_version; print(get_version())"
        echo "Building version: $VERSION"
        
        # 创建Inno Setup脚本
        @"
        #define MyAppName "伊利奶牛选配"
        #define MyAppVersion "$VERSION"
        #define MyAppPublisher "Genetic Improve Team"
        #define MyAppURL "https://github.com/Barton0411/genetic_improve"
        #define MyAppExeName "伊利奶牛选配.exe"
        
        [Setup]
        AppId={{7133EFA4-A392-4138-BA22-2BEB199B5056}
        AppName={#MyAppName}
        AppVersion={#MyAppVersion}
        AppPublisher={#MyAppPublisher}
        AppPublisherURL={#MyAppURL}
        AppSupportURL={#MyAppURL}
        AppUpdatesURL={#MyAppURL}
        DefaultDirName={autopf}\{#MyAppName}
        UninstallDisplayIcon={app}\{#MyAppExeName}
        ArchitecturesAllowed=x64compatible
        ArchitecturesInstallIn64BitMode=x64compatible
        DisableProgramGroupPage=yes
        OutputBaseFilename=伊利奶牛选配_v{#MyAppVersion}_win
        SetupIconFile=icon.ico
        SolidCompression=yes
        WizardStyle=modern
        OutputDir=installer_output
        Compression=lzma2
        CompressionThreads=auto
        
        [Languages]
        Name: "english"; MessagesFile: "compiler:Default.isl"
        
        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
        
        [Files]
        Source: "dist\伊利奶牛选配\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
        
        [Icons]
        Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
        Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Tasks: desktopicon
        
        [Run]
        Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Description: "{cm:LaunchProgram,{#StringChange(MyAppName, '&', '&&')}}"; Flags: nowait postinstall skipifsilent
        "@ | Out-File -FilePath setup.iss -Encoding UTF8
        
        echo "Inno Setup script created"
    
    - name: Build installer with Inno Setup
      run: |
        # 创建输出目录
        New-Item -ItemType Directory -Force -Path installer_output
        
        # 编译安装包
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
        
        # 显示生成的文件
        Get-ChildItem installer_output
    
    # Windows便携版zip已废弃，只保留exe安装包
    # - name: Create portable ZIP package
    #   run: |
    #     # 获取版本号
    #     $VERSION = python -c "from version import get_version; print(get_version())"
    #
    #     # 创建便携版ZIP
    #     $ZIP_NAME = "伊利奶牛选配_v$VERSION" + "_win.zip"
    #     Compress-Archive -Path "dist\伊利奶牛选配\*" -DestinationPath $ZIP_NAME -Force
    #
    #     echo "Portable package created: $ZIP_NAME"
    #
    #     # 显示文件大小
    #     $size = (Get-Item $ZIP_NAME).Length / 1MB
    #     echo "Package size: $([math]::Round($size, 2)) MB"

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: installer_output/*.exe
        retention-days: 30

    # Windows便携版zip已废弃
    # - name: Upload Windows portable
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: windows-portable
    #     path: 伊利奶牛选配_v*_win.zip
    #     retention-days: 30

    - name: Upload changelog artifact
      uses: actions/upload-artifact@v4
      with:
        name: changelog-file
        path: CHANGELOG_v*.txt
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/Library/Caches/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # 安装创建DMG的工具
        brew install create-dmg

    - name: Remove unnecessary large packages
      run: |
        # 明确卸载不需要的大型库，避免被PyInstaller打包
        pip3 uninstall -y torch torchvision torchaudio pyarrow || true
        echo "Removed large packages that are not needed"

    # macOS不打包数据库，跳过数据库准备步骤（减小安装包体积）
    # - name: Prepare database file
    #   run: |
    #     python3 scripts/prepare_database.py

    - name: Generate changelog
      run: |
        python3 auto_generate_changelog.py
        echo "Generated changelog file:"
        ls -la CHANGELOG_v* || echo "No changelog files found"
    
    - name: Convert ICO to ICNS and build macOS application
      run: |
        # 检查是否有icon.ico文件
        if [ -f "icon.ico" ]; then
          echo "Found icon.ico, converting to ICNS..."
          
          # 创建临时目录用于图标转换
          mkdir -p icon_temp.iconset
          
          # 使用sips转换ICO到PNG，然后创建ICNS
          sips -z 16 16 "icon.ico" --out "icon_temp.iconset/icon_16x16.png" || echo "Failed to create 16x16 icon"
          sips -z 32 32 "icon.ico" --out "icon_temp.iconset/icon_16x16@2x.png" || echo "Failed to create 16x16@2x icon"
          sips -z 32 32 "icon.ico" --out "icon_temp.iconset/icon_32x32.png" || echo "Failed to create 32x32 icon"
          sips -z 64 64 "icon.ico" --out "icon_temp.iconset/icon_32x32@2x.png" || echo "Failed to create 32x32@2x icon"
          sips -z 128 128 "icon.ico" --out "icon_temp.iconset/icon_128x128.png" || echo "Failed to create 128x128 icon"
          sips -z 256 256 "icon.ico" --out "icon_temp.iconset/icon_128x128@2x.png" || echo "Failed to create 128x128@2x icon"
          sips -z 256 256 "icon.ico" --out "icon_temp.iconset/icon_256x256.png" || echo "Failed to create 256x256 icon"
          sips -z 512 512 "icon.ico" --out "icon_temp.iconset/icon_256x256@2x.png" || echo "Failed to create 256x256@2x icon"
          sips -z 512 512 "icon.ico" --out "icon_temp.iconset/icon_512x512.png" || echo "Failed to create 512x512 icon"
          sips -z 1024 1024 "icon.ico" --out "icon_temp.iconset/icon_512x512@2x.png" || echo "Failed to create 512x512@2x icon"
          
          # 创建ICNS文件
          if iconutil -c icns icon_temp.iconset -o "icon.icns"; then
            echo "✅ Successfully created icon.icns"
            
            # 验证ICNS文件
            if [ -f "icon.icns" ]; then
              echo "ICNS file size: $(ls -lh icon.icns | awk '{print $5}')"
              # 检查ICNS文件内容
              file "icon.icns"
            fi
          else
            echo "❌ Failed to create ICNS file"
            
            # 尝试备用方法：使用简单的PNG转ICNS
            if [ -f "icon.ico" ]; then
              echo "🔄 Trying alternative method: PNG to ICNS"
              
              # 转换ICO为PNG
              sips -s format png "icon.ico" --out "temp_icon.png" || true
              
              if [ -f "temp_icon.png" ]; then
                # 创建简单的iconset
                mkdir -p simple.iconset
                sips -z 512 512 "temp_icon.png" --out "simple.iconset/icon_512x512.png" || true
                sips -z 256 256 "temp_icon.png" --out "simple.iconset/icon_256x256.png" || true
                sips -z 128 128 "temp_icon.png" --out "simple.iconset/icon_128x128.png" || true
                sips -z 64 64 "temp_icon.png" --out "simple.iconset/icon_64x64.png" || true
                sips -z 32 32 "temp_icon.png" --out "simple.iconset/icon_32x32.png" || true
                sips -z 16 16 "temp_icon.png" --out "simple.iconset/icon_16x16.png" || true
                
                # 再次尝试创建ICNS
                iconutil -c icns simple.iconset -o "icon.icns" || true
                
                # 清理
                rm -rf simple.iconset temp_icon.png
              fi
            fi
            
            # 如果仍然失败，删除无效文件
            if [ ! -f "icon.icns" ] || [ ! -s "icon.icns" ]; then
              rm -f "icon.icns"
              echo "⚠️ Will proceed without icon"
            fi
          fi
          
          # 清理临时文件
          rm -rf icon_temp.iconset
        else
          echo "No icon.ico file found"
        fi
        
        # 检查是否成功创建了ICNS文件
        if [ -f "icon.icns" ]; then
          echo "icon.icns exists, size: $(ls -lh icon.icns)"
        else
          echo "No icon.icns file available for build"
        fi
        
        python -m PyInstaller GeneticImprove.spec --clean --noconfirm
    
    - name: Fix app permissions, icon and security
      run: |
        # 设置应用显示名称为伊利奶牛选配
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 伊利奶牛选配" "dist/伊利奶牛选配.app/Contents/Info.plist" || true
        /usr/libexec/PlistBuddy -c "Set :CFBundleName 伊利奶牛选配" "dist/伊利奶牛选配.app/Contents/Info.plist" || true
        
        # 如果有ICNS文件，确保正确设置
        if [ -f "icon.icns" ]; then
          # 确保Resources目录存在
          mkdir -p "dist/伊利奶牛选配.app/Contents/Resources/"
          
          # 复制图标文件
          cp "icon.icns" "dist/伊利奶牛选配.app/Contents/Resources/" || true
          
          # 设置Info.plist中的图标引用（尝试多种格式）
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile icon.icns" "dist/伊利奶牛选配.app/Contents/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName icon" "dist/伊利奶牛选配.app/Contents/Info.plist" || true
          
          # 验证图标文件是否正确复制
          if [ -f "dist/伊利奶牛选配.app/Contents/Resources/icon.icns" ]; then
            echo "✅ 图标文件已成功复制到应用程序包中"
            ls -la "dist/伊利奶牛选配.app/Contents/Resources/icon.icns"
          else
            echo "❌ 图标文件复制失败"
          fi
        else
          echo "⚠️ 没有找到icon.icns文件"
        fi
        
        # 修复权限
        chmod -R 755 "dist/伊利奶牛选配.app"
        find "dist/伊利奶牛选配.app" -name "*.dylib" -exec chmod 755 {} \;
        find "dist/伊利奶牛选配.app" -name "*.so" -exec chmod 755 {} \;
        
        # 清除扩展属性（避免"已损坏"警告）
        xattr -cr "dist/伊利奶牛选配.app"
        
        # 创建安装说明文件
        cat > "安装说明.txt" << 'EOF'
        伊利奶牛选配 安装说明
        
        如果遇到"Apple无法验证此应用"的提示：
        
        方法1（推荐）：
        1. 右键点击应用程序
        2. 选择"打开"
        3. 在弹出对话框中点击"打开"
        
        方法2：
        1. 打开"系统偏好设置" > "安全性与隐私"
        2. 在"通用"选项卡中点击"仍要打开"
        
        这是因为应用未经过Apple官方签名，但软件本身是安全的。
        EOF
    
    - name: Create beautiful DMG with background
      run: |
        # 获取版本号
        VERSION=$(python -c "from version import get_version; print(get_version())")
        echo "Building version: $VERSION"
        
        APP_NAME="伊利奶牛选配"
        DMG_NAME="伊利奶牛选配_v${VERSION}_mac"
        DMG_PATH="${DMG_NAME}.dmg"
        
        # 创建DMG背景图片目录（如果需要）
        mkdir -p dmg_resources
        
        # 创建一个简单的背景图片说明文件
        cat > dmg_resources/README.txt << EOF
        伊利奶牛选配 v$VERSION
        
        安装说明：
        1. 将 伊利奶牛选配 拖拽到 Applications 文件夹
        2. 从启动台或应用程序文件夹启动应用
        3. 首次运行可能需要右键点击选择"打开"
        EOF
        
        # 使用create-dmg创建美观的DMG
        create-dmg \
          --volname "伊利奶牛选配" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 100 \
          --icon "${APP_NAME}.app" 150 150 \
          --hide-extension "${APP_NAME}.app" \
          --app-drop-link 450 150 \
          --text-size 14 \
          --format UDZO \
          --hdiutil-quiet \
          --no-internet-enable \
          "$DMG_PATH" \
          "dist/" || {
            # 如果create-dmg失败，使用简单方法
            echo "create-dmg failed, using simple method"
            
            DMG_DIR="dmg_temp"
            rm -rf "$DMG_DIR"
            mkdir -p "$DMG_DIR"
            
            cp -R "dist/伊利奶牛选配.app" "$DMG_DIR/"
            ln -s /Applications "$DMG_DIR/Applications"
            
            hdiutil create -volname "伊利奶牛选配" \
                -srcfolder "$DMG_DIR" \
                -ov -format UDZO \
                "$DMG_PATH"
            
            rm -rf "$DMG_DIR"
        }
        
        echo "macOS DMG created: $DMG_PATH"
        
        # 显示文件大小
        size=$(du -sh "$DMG_PATH" | cut -f1)
        echo "DMG size: $size"
    
    - name: Sign DMG (optional)
      run: |
        # 如果有开发者证书，可以签名
        # codesign --force --deep --sign "Developer ID Application: Your Name" *.dmg
        echo "Skipping code signing (no certificate configured)"
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-release
        path: 伊利奶牛选配_v*_mac.dmg
        retention-days: 30

  upload-to-oss:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts (with retry)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 用 gh CLI 下载并加 30s 间隔的外层重试，规避大文件(数百MB)下载偶发失败
        for i in 1 2 3 4 5; do
          echo "📥 下载 artifacts 尝试 $i/5 ..."
          if gh run download ${{ github.run_id }} --dir .; then
            echo "✅ artifacts 下载成功"
            break
          fi
          if [ "$i" = "5" ]; then
            echo "❌ 5 次重试后仍失败"
            exit 1
          fi
          echo "⏳ 等待 30s 后重试..."
          sleep 30
        done

    - name: List downloaded artifacts
      run: |
        echo "📦 列出所有下载的文件："
        ls -laR
        echo ""
        echo "📂 目录结构："
        tree -L 3 || find . -type f -print

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" =~ refs/tags/.* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"

    - name: Setup OSS CLI
      run: |
        # 下载并安装阿里云OSS CLI工具
        wget -q https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64 -O ossutil
        chmod +x ossutil

        # 配置OSS CLI（使用GitHub Secrets中的密钥）
        ./ossutil config -e oss-cn-beijing.aliyuncs.com -i "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" -k "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"

    - name: Upload Windows installer to OSS
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        WIN_EXE="windows-installer/伊利奶牛选配_v${VERSION}_win.exe"

        echo "📤 准备上传 Windows 安装包..."
        echo "查找文件: $WIN_EXE"

        # 验证文件存在
        if [ ! -f "$WIN_EXE" ]; then
          echo "❌ 错误：Windows安装包不存在: $WIN_EXE"
          echo "当前目录内容："
          ls -la windows-installer/
          exit 1
        fi

        # 显示文件信息
        FILE_SIZE=$(du -h "$WIN_EXE" | cut -f1)
        echo "✅ 找到文件，大小: $FILE_SIZE"

        # 上传到OSS
        ./ossutil cp "$WIN_EXE" \
          "oss://genetic-improve/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_win.exe" --force

        # 验证上传
        ./ossutil stat "oss://genetic-improve/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_win.exe"

        echo "✅ Windows 安装包上传完成！"
        echo "OSS URL: https://genetic-improve.oss-cn-beijing.aliyuncs.com/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_win.exe"

    - name: Upload macOS DMG to OSS
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        MAC_DMG="macos-release/伊利奶牛选配_v${VERSION}_mac.dmg"

        echo "📤 准备上传 macOS DMG..."
        echo "查找文件: $MAC_DMG"

        # 验证文件存在
        if [ ! -f "$MAC_DMG" ]; then
          echo "❌ 错误：macOS DMG不存在: $MAC_DMG"
          echo "当前目录内容："
          ls -la macos-release/
          exit 1
        fi

        # 显示文件信息
        FILE_SIZE=$(du -h "$MAC_DMG" | cut -f1)
        echo "✅ 找到文件，大小: $FILE_SIZE"

        # 上传到OSS
        ./ossutil cp "$MAC_DMG" \
          "oss://genetic-improve/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_mac.dmg" --force

        # 验证上传
        ./ossutil stat "oss://genetic-improve/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_mac.dmg"

        echo "✅ macOS DMG 上传完成！"
        echo "OSS URL: https://genetic-improve.oss-cn-beijing.aliyuncs.com/releases/v${VERSION}/伊利奶牛选配_v${VERSION}_mac.dmg"

    - name: Upload changelog to OSS
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"

        # 检查changelog文件是否存在
        if [ -f "changelog-file/CHANGELOG_v${VERSION}.txt" ]; then
          echo "📤 上传 CHANGELOG 到 OSS..."

          # 上传到OSS releases目录
          ./ossutil cp "changelog-file/CHANGELOG_v${VERSION}.txt" \
            "oss://genetic-improve/releases/v${VERSION}/CHANGELOG.txt" --force

          echo "✅ Changelog 上传完成！"
          echo "OSS URL: https://genetic-improve.oss-cn-beijing.aliyuncs.com/releases/v${VERSION}/CHANGELOG.txt"
        else
          echo "⚠️ 未找到 changelog 文件，跳过上传"
          ls -la changelog-file/ || echo "changelog-file 目录不存在"
        fi

    - name: Update version.json and upload to OSS
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        echo "📝 更新 version.json..."

        # 关键修复：从 git 恢复 version.json，确保上传的是本 tag 提交里的版本。
        # 此前 "Download all artifacts" 用 gh run download --dir . 会把各 artifact 子目录里
        # 夹带的旧 version.json 污染工作区，导致上传到 OSS 的版本号是旧的（客户端检查不到更新）。
        git checkout HEAD -- version.json
        echo "已从 git(HEAD=本tag) 恢复 version.json，当前版本号："
        python3 -c "import json; print(json.load(open('version.json'))['version'])"

        # 读取version.json内容并上传
        if [ -f "version.json" ]; then
          echo "✅ 找到 version.json，上传到 OSS..."

          # 上传version.json到latest目录（软件检查更新时读取这个）
          ./ossutil cp "version.json" "oss://genetic-improve/releases/latest/version.json" --force

          # 同时备份到当前版本目录
          ./ossutil cp "version.json" \
            "oss://genetic-improve/releases/v${VERSION}/version.json" --force

          echo "✅ version.json 上传完成！"
          echo "Latest URL: https://genetic-improve.oss-cn-beijing.aliyuncs.com/releases/latest/version.json"
          echo "Version URL: https://genetic-improve.oss-cn-beijing.aliyuncs.com/releases/v${VERSION}/version.json"

          # 显示version.json内容
          echo "📄 version.json 内容："
          cat version.json
        else
          echo "❌ 未找到 version.json 文件"
          exit 1
        fi

  create-release:
    needs: [build-windows, build-macos, upload-to-oss]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts (with retry)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for i in 1 2 3 4 5; do
          echo "📥 下载 artifacts 尝试 $i/5 ..."
          if gh run download ${{ github.run_id }} --dir .; then
            echo "✅ artifacts 下载成功"
            break
          fi
          if [ "$i" = "5" ]; then echo "❌ 5 次重试后仍失败"; exit 1; fi
          echo "⏳ 等待 30s 后重试..."; sleep 30
        done

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Stage changelog
      run: |
        # 第一步已下载全部 artifact，changelog 在 ./changelog-file/ 子目录，展平到 ./changelog/
        # 保持后续步骤引用的 changelog/CHANGELOG_v*.txt 路径不变
        mkdir -p ./changelog
        find ./changelog-file -type f -name 'CHANGELOG_*' -exec cp {} ./changelog/ \; 2>/dev/null || true
        ls -la ./changelog/ || echo "changelog 目录为空（将使用默认 release notes）"
    
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        CHANGELOG_FILE="changelog/CHANGELOG_v${VERSION}.txt"

        # 创建release notes文件
        cat > release_notes.md << 'EOFNOTES'
        ## 伊利奶牛选配系统更新

        ### 更新内容
        EOFNOTES

        if [ -f "$CHANGELOG_FILE" ]; then
          echo "Found changelog file, reading content..."
          # 读取changelog内容并添加
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "- $line" >> release_notes.md
            fi
          done < "$CHANGELOG_FILE"
        else
          echo "No changelog found, using default content..."
          cat >> release_notes.md << 'EOFNOTES'
        - 优化导航栏界面配色方案，提升视觉体验
        - 改进菜单选中状态显示效果
        - 修复Excel报告中图表重叠显示问题
        - 优化散点图布局排列方式
        EOFNOTES
        fi

        cat release_notes.md
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref }}
        name: 伊利奶牛选配 v${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
        files: |
          windows-installer/*.exe
          macos-release/*.dmg
        draft: false
        prerelease: false